<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Web-IBIS</title>
<style>
  /* The screen is the terminal's: 1280 x 720 units, as large as the tablet allows. */
  /* --bar is the height of the console's strip of status cells: 11.3 % of the screen, as
     the Rejsekort manual's pictures of it have it */
  :root { --u: 1px; --bar: calc(81 * var(--u)); --row: calc(92.5 * var(--u));
    --ink: #000; --line: #555; --soft: #444; --dim: #8a8a8a; --paper: #fff;
    --field: #f2f2f2; --pick: #dff3df; --now: #f0b429; --rail: #2e9e5b; --plate: #ffd23f;
    --early: #c62828; --ontime: #1e7d3c; --late: #d06a00; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
    font-family: "DejaVu Sans", Verdana, "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  #stage { position: relative; width: calc(1280 * var(--u)); height: calc(720 * var(--u));
    background: var(--paper); overflow: hidden; font-size: calc(22 * var(--u)); }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: block; }
  .u { position: absolute; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* the bar along the top: the login picture's strip, or plain */
  .bar { position: absolute; left: 0; top: 0; width: 100%; height: var(--bar);
    background: var(--paper) url("/tex/login.png") no-repeat 0 0 / 100% auto; }
  .plain .bar { background: var(--paper); border-bottom: 1px solid var(--line); }
  .clock { position: absolute; right: 0; top: 0; width: calc(124 * var(--u)); height: calc(var(--bar) - 1px);
    background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.2; font-size: calc(30 * var(--u)); font-variant-numeric: tabular-nums; font-weight: 700; }
  .clock .c-date { font-size: calc(21 * var(--u)); font-weight: 400; }
  .plain .clock { border-left: 1px solid #a9a9a9; border-bottom: 1px solid #808080; }
  /* (the fork) the bar along the bottom is the console's own, as the Rejsekort manual has
     it: ESC, Menu, Billetter, Linje, Betjening, the pram and the two arrows. The manual's
     page 5 gives the colours their meaning - a white key can be pressed, a grey or a blue
     one cannot, and the yellow one is the menu you are standing in. Menu, Billetter and
     Betjening belong to the real console and not to this page, so they stand blue and grey
     here, which is the console's own way of saying they lead nowhere. */
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: calc(84 * var(--u));
    display: flex; gap: calc(4 * var(--u)); padding: calc(5 * var(--u)); background: #cfd6dc; }
  .foot button { flex: 1; border: 1px solid #9aa3ab; border-radius: calc(4 * var(--u));
    background: #e9ecee; font-size: calc(20 * var(--u)); font-weight: 700; color: #1b1b1b;
    display: flex; align-items: center; justify-content: center; }
  .foot button.dead, .foot button.off { cursor: default; }
  .foot .esc { flex: 1.25; font-size: calc(26 * var(--u)); font-weight: 400; }
  .foot .off { background: #ccd3d8; }
  .foot .blue { background: #a3b4d2; }
  .foot .now { background: #ecebc2; }
  .foot .arrow { flex: 0 0 calc(100 * var(--u)); }
  .foot .arrow svg, .foot .pram svg { width: calc(40 * var(--u)); height: calc(40 * var(--u)); display: block; }
  .foot button:not(.dead):not(.blue):active { background: var(--pick); }
  h2 { margin: 0; font-weight: 400; font-size: calc(30 * var(--u)); }

  /* (the fork) the console's list: six rows between the strip and the bar, a white row for
     every line or trip and a pale blue-grey one for the slots left over */
  .sheet { position: absolute; left: 0; right: 0; top: var(--bar);
    bottom: calc(84 * var(--u) + var(--row));
    display: grid; grid-template-rows: repeat(5, 1fr); background: #d8e0e3;
    border-top: 1px solid #6b7580; }
  .sheet.two { grid-template-columns: repeat(2, 1fr); grid-auto-flow: row; }
  .cell { background: #fff; border-right: 1px solid #6b7580; border-bottom: 1px solid #6b7580;
    display: flex; align-items: center; text-align: left; padding: 0 calc(24 * var(--u));
    font-size: calc(52 * var(--u)); font-weight: 700; color: #111; }
  .cell.gap { background: #d8e0e3; cursor: default; }
  .cell.mine { background: #ffe77f; }
  .cell:not(.gap):active { background: var(--pick); }
  .trip { background: #fff; border-bottom: 1px solid #6b7580; text-align: left;
    padding: 0 calc(24 * var(--u)); display: flex; flex-direction: column; justify-content: center;
    gap: calc(2 * var(--u)); color: #111; }
  .trip .w { font-size: calc(26 * var(--u)); font-variant-numeric: tabular-nums; }
  .trip .r { font-size: calc(42 * var(--u)); font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .trip.pick { background: #ffe77f; }
  .trip.past { color: #8a8a8a; }
  .trip.driving { background: #cfe8cf; }
  .trip:not(.gap):active { background: var(--pick); }
  .trip.gap { background: #d8e0e3; cursor: default; }

  /* (the fork) TUR I AUTOMATISK STOPPESTEDSVALG, the screen you drive by: the blue panel
     down the left with the line, the tour and how late the bus is, "Afslut tur" under it,
     and the stops still to come down the right - the hand beside the top one while the
     bus stands at it, as the manual's page 11 has it */
  .drive { position: absolute; left: 0; right: 0; top: var(--bar);
    bottom: calc(84 * var(--u) + var(--row));
    display: grid; grid-template-columns: 1fr 1fr; background: #d8e0e3; border-top: 1px solid #6b7580; }
  .drive .side, .drive .stops { display: grid; grid-template-rows: repeat(5, 1fr); }
  .drive .side { border-right: 1px solid #6b7580; }
  .drive .panel { grid-row: span 4; background: linear-gradient(#4f85d2, #6ba2e2); color: #dceaff;
    display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
    font-size: calc(40 * var(--u)); border-bottom: 1px solid #6b7580; }
  .drive .end { background: #fff; border-bottom: 1px solid #6b7580; display: flex; align-items: center;
    text-align: left; padding: 0 calc(24 * var(--u)); font-size: calc(44 * var(--u)); font-weight: 700; color: #111; }
  .drive .end:active { background: var(--pick); }
  .drive .slot { background: #d8e0e3; }
  .drive .stop { background: #fff; border-bottom: 1px solid #6b7580; display: flex; align-items: center;
    padding: 0 calc(12 * var(--u)) 0 calc(24 * var(--u)); font-size: calc(42 * var(--u)); color: #111; }
  .drive .stop .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* (the one thing the console does not draw: when the bus is due there) */
  .drive .stop .t { font-size: calc(24 * var(--u)); color: #5a5a5a; font-variant-numeric: tabular-nums;
    margin-left: calc(12 * var(--u)); }
  .drive .stop svg { width: calc(54 * var(--u)); height: calc(54 * var(--u)); flex: none; margin-left: calc(8 * var(--u)); }
  .drive .stop.done { color: #8a8a8a; }
  /* the crowd in the strip stands there while a trip is under way */
  .strip i.crowd svg { display: none; }
  #duty .strip i.crowd svg { display: block; }
  /* (the fork) the GPS key, as the manual's page 12 has it: press it and the cell goes
     grey, and from then on the stops are served by hand */
  .strip i.gps { cursor: pointer; }
  .nogps .strip i.gps { background: #cdd0d6; }
  /* with the GPS off the driver's own key stands over the blue panel */
  .drive .side.manual .panel { grid-row: span 3; }
  .drive .stop.pickable { cursor: pointer; }
  .drive .stop.pickable:active { background: var(--pick); }

  /* (the fork) the console's Menu, as the manual's page 17 has it: a deep blue field over
     two rows and six keys under it. Telebus, the sound and the maintenance belong to the
     real console, so they stand grey - the console's own way of saying a key leads
     nowhere. The bar loses its pram and its arrows here, as the manual's picture has it. */
  .menu { position: absolute; left: 0; right: 0; top: var(--bar);
    bottom: calc(84 * var(--u) + var(--row));
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(5, 1fr);
    background: #d8e0e3; border-top: 1px solid #6b7580; }
  .menu .sky { grid-column: span 2; grid-row: span 2; background: #2f3192; }
  .menu .mi { background: #fff; border-right: 1px solid #6b7580; border-bottom: 1px solid #6b7580;
    display: flex; align-items: center; text-align: left; padding: 0 calc(24 * var(--u));
    font-size: calc(40 * var(--u)); color: #111; }
  .menu .mi.off { background: #ccd3d8; color: #6a7278; cursor: default; }
  .menu .mi:not(.dead):active { background: var(--pick); }
  #menu .foot .pram, #menu .foot .arrow,
  #sound .foot .pram, #sound .foot .arrow { visibility: hidden; }

  /* (the fork) INDSTILLING AF LYD, the manual's page 30: the console's own sound settings,
     which this page can keep for itself - it runs in a browser, and a browser can beep. A
     row for each: a key that does something, a key that does not, and a fault. The volume
     is typed on the console's own number pad. */
  .snd { position: absolute; left: 0; right: 0; top: var(--bar); bottom: calc(84 * var(--u));
    background: #2f3192; color: #fff; display: grid; grid-template-rows: repeat(3, 1fr) 1fr;
    padding: calc(10 * var(--u)) calc(24 * var(--u)) calc(16 * var(--u)); }
  .snd .r { position: relative; display: grid; grid-template-columns: calc(250 * var(--u)) 1fr calc(300 * var(--u));
    align-items: end; column-gap: calc(40 * var(--u)); padding-bottom: calc(16 * var(--u)); }
  .snd .lb { position: absolute; left: 0; top: calc(2 * var(--u)); font-size: calc(30 * var(--u)); }
  .snd .sw, .snd .tst, .snd .box { border: 0; border-radius: calc(8 * var(--u));
    height: calc(74 * var(--u)); font-size: calc(34 * var(--u)); font-weight: 700; color: #111;
    display: flex; align-items: center; justify-content: center; }
  .snd .sw { background: #b9e4e4; width: calc(190 * var(--u)); }
  .snd .tst, .snd .box { background: #fff; }
  .snd .box { font-variant-numeric: tabular-nums; }
  .snd .sw:active, .snd .tst:active, .snd .box:active { background: var(--pick); }
  .snd .vol { display: flex; flex-direction: column; align-items: center; gap: calc(2 * var(--u)); }
  .snd .vol span { font-size: calc(21 * var(--u)); color: #b9c2ea; }
  .snd .vol .box { width: calc(330 * var(--u)); }
  .snd .save .tst { grid-column: 3; align-self: center; }

  /* (the fork) the console's row of card readers, as the manual's pages 23, 27 and 28 have
     it: the bottom row of every screen, one box for each of the last cards held to a
     reader. The text is the customer's type and a crossed box is a check-out; a white box
     is a reader that has not been used. The game has no Rejsekort and so no card types to
     colour them by, so every card here is the blue personal one. The boxes do nothing:
     they are the driver's check that the customers remembered to check in and out. */
  .cards { position: absolute; left: 0; right: 0; bottom: calc(84 * var(--u)); height: var(--row);
    display: flex; gap: calc(9 * var(--u)); padding: calc(5 * var(--u)) calc(7 * var(--u));
    background: #d8e0e3; }
  .cards i { flex: 1; position: relative; border: calc(2 * var(--u)) solid #1b1b1b;
    border-radius: calc(22 * var(--u)); background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-style: normal; font-size: calc(26 * var(--u)); color: #111; overflow: hidden; }
  /* the manual's page 28: the background is the TYPE of card held to the reader */
  .cards i.personal { background: #3573c2; }   /* personligt, pendler, ungdoms, skole */
  .cards i.anon { background: #42b23b; }       /* anonymt */
  .cards i.flex { background: #f5f014; }
  .cards i.blocked { background: #d6342c; }    /* spærret ("BLK") */
  /* a crossed box checked out: the two lines run corner to corner */
  .cards i.out::before, .cards i.out::after { content: ""; position: absolute; left: calc(-8 * var(--u));
    right: calc(-8 * var(--u)); top: 50%; height: calc(2 * var(--u)); background: #1b1b1b; }
  .cards i.out::before { transform: rotate(18deg); }
  .cards i.out::after { transform: rotate(-18deg); }

  /* (the fork) the console behind its lock, as the manual's page 18 has it: the same login
     screen, with the driver's own number standing grey and only the pass code to type */
  #login.locked .drawn.title { top: calc(150 * var(--u)); font-size: calc(40 * var(--u));
    font-weight: 400; color: #3b3f9e; letter-spacing: 0; }
  #login.locked #b-driver { background: #9aa0a6; }
  #login.locked #driver { color: #111; text-align: center; }
  #login .drawn.hint { white-space: pre-line; line-height: 1.35; }

  /* login: the picture with its two fields */
  #login { background: var(--paper) url("/tex/login.png") no-repeat 0 0 / 100% 100%; }
  #login input { position: absolute; border: 0; outline: 0; background: transparent; font: inherit;
    font-size: calc(22 * var(--u)); padding: 0 calc(8 * var(--u)); }
  #login input:focus { background: rgba(0, 120, 255, .06); }
  #login .esc { position: absolute; bottom: 0; left: 0; height: calc(60 * var(--u)); font-size: calc(26 * var(--u));
    font-weight: 700; padding: 0 calc(17 * var(--u)); }
  /* (the picture has its own ESC: the key lies over it) */
  #login:not(.plain) .esc { color: transparent; font-weight: 400; }
  #login .drawn { display: none; }
  #login.plain { background: var(--paper); }
  #login.plain .drawn { display: block; }
  /* (the fork) the console's own fields, as the manual's picture has them: a sunken grey
     edge, white until the field is the one being typed into, and then a pale cyan */
  .drawn.box { background: #fff; border: 1px solid #7a7a7a;
    border-top-color: #4a4a4a; border-left-color: #4a4a4a; }
  .drawn.box.here { background: #afe4e8; }
  .drawn.title { left: 0; right: 0; top: calc(182 * var(--u)); text-align: center; font-size: calc(92 * var(--u));
    font-weight: 700; color: #5d5e60; letter-spacing: calc(-2 * var(--u)); }
  #login .drawn.lbl { font-size: calc(27 * var(--u)); text-align: right; left: calc(120 * var(--u));
    width: calc(341 * var(--u)); }
  #login .drawn.hint { left: 0; right: 0; text-align: center; font-size: calc(26 * var(--u)); }

  .note { color: var(--dim); }
  .plate { justify-self: start; background: #000; color: #fff; font-weight: 700; padding: 0 calc(10 * var(--u));
    border-radius: calc(3 * var(--u)); font-size: calc(21 * var(--u)); }
  .past .plate { background: var(--dim); }

  /* (the fork) the console's own question box, as the manual has it: a title bar with its
     mark, the trip in the middle, and Ja and Nej across the whole foot of it */
  .ask { position: absolute; inset: 0; background: rgba(0, 0, 0, .25); display: none; align-items: center; justify-content: center; }
  .ask.on { display: flex; }
  .ask .box { width: calc(830 * var(--u)); background: #d6d8de; border: 1px solid #6b7580; padding: 0; }
  .ask .ttl { background: #e4e6ea; border-bottom: 1px solid #6b7580; display: flex; align-items: center;
    gap: calc(12 * var(--u)); padding: calc(7 * var(--u)) calc(16 * var(--u)); font-size: calc(30 * var(--u)); }
  .ask .ttl svg { width: calc(32 * var(--u)); height: calc(32 * var(--u)); display: block; }
  .ask .mid { padding: calc(44 * var(--u)) calc(26 * var(--u)) calc(56 * var(--u)); text-align: center; }
  .ask .what { font-weight: 700; font-size: calc(27 * var(--u)); line-height: 1.35; white-space: pre-line; }
  .ask p { margin: calc(32 * var(--u)) 0 0; font-weight: 700; font-size: calc(27 * var(--u)); }
  .ask .err { color: var(--early); min-height: 1.2em; font-size: calc(21 * var(--u)); margin: calc(14 * var(--u)) 0 0; }
  .ask .btns { display: flex; gap: calc(5 * var(--u)); padding: calc(5 * var(--u)); }
  .ask .btns button { flex: 1; height: calc(78 * var(--u)); border: 1px solid #9aa3ab; background: #e9ecee;
    font-size: calc(32 * var(--u)); font-weight: 700; }
  .ask .btns button:active { background: var(--pick); }
  .ask .btns button.lone { flex: 0 0 calc(200 * var(--u)); margin: 0 auto; }

  .early { color: var(--early); } .ontime { color: var(--ontime); } .late { color: var(--late); }
  .empty { position: absolute; left: 0; right: 0; top: 40%; text-align: center; color: var(--soft); font-size: calc(28 * var(--u)); }
  .lost { position: absolute; left: 50%; bottom: calc(76 * var(--u)); transform: translateX(-50%); background: var(--early); color: #fff;
    padding: calc(8 * var(--u)) calc(20 * var(--u)); font-weight: 700; display: none; z-index: 5; }
  .lost.on { display: block; }

  /* (the fork) the console's own number pad, as the Rejsekort manual has it: a cream panel
     with the typed number across the top, the digits three to a row, a close key over a
     tall ENTER whose letters stand one under the other, and CE beside the nought */
  .pad { position: absolute; inset: 0; background: transparent; display: none; z-index: 6; }
  .pad.on { display: block; }
  .pad .panel { position: absolute; left: calc(483 * var(--u)); top: calc(107 * var(--u));
    width: calc(738 * var(--u)); height: calc(551 * var(--u)); background: #f8f696;
    border: calc(2 * var(--u)) solid #e3df72; padding: calc(16 * var(--u)) calc(22 * var(--u)) calc(11 * var(--u));
    display: grid; grid-template-rows: calc(60 * var(--u)) 1fr; gap: calc(44 * var(--u)); }
  .pad .shown { background: #fff; border: 1px solid #8f8f8f; border-top-color: #5a5a5a; border-left-color: #5a5a5a;
    margin: 0 calc(80 * var(--u)) 0 calc(37 * var(--u));
    display: flex; align-items: center; padding: 0 calc(16 * var(--u)); font-size: calc(40 * var(--u));
    font-variant-numeric: tabular-nums; letter-spacing: calc(4 * var(--u)); overflow: hidden; }
  .pad .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
    gap: calc(7 * var(--u)); }
  .pad .grid button { background: #b4e5eb; border: 1px solid #8cc3ca; border-radius: calc(10 * var(--u));
    font-size: calc(44 * var(--u)); font-weight: 700; color: #111; }
  .pad .grid button:active { background: #7fd0da; }
  .pad .enter { grid-column: 4; grid-row: 2 / span 3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; line-height: 1.12; font-size: calc(36 * var(--u)); }
  /* (the point key is the grey one on the console, and it types nothing) */
  .pad .grid button.dot { background: #cfd0d1; border-color: #b4b5b6; font-size: calc(34 * var(--u)); }

  /* (the fork) the plain login, where the player has no picture of the console: the screen
     the manual shows, without its owner's marks - the strip of buttons along the top with
     the date and the hour at its end, the two fields and the hint under them */
  /* (the fork) the console's own strip of status cells, as the Rejsekort manual has it:
     IFS-FM (which the buses do not use), two spare cells, then wi-fi, the signal, the
     printer, the GPS, the card reader, the alarm and the help - and the date over the
     hour at the end. The icons are drawn here; none of them is anybody's artwork. */
  .plain .strip { position: absolute; left: 0; top: 0; right: calc(213 * var(--u)); height: calc(var(--bar) - 1px);
    display: flex; border-bottom: 1px solid #808080; background: #fff; }
  .plain .clock { width: calc(213 * var(--u)); }
  .screen:not(.plain) .strip { display: none; }
  .strip i { flex: 1; border-right: 1px solid #a9a9a9; background: #fff;
    display: flex; align-items: center; justify-content: center; font-style: normal; }
  .strip i svg { width: calc(46 * var(--u)); height: calc(46 * var(--u)); display: block; }
  .strip i.green { background: #51bd36; }
  .strip i.grey { background: #cdd0d6; }
  /* the signal stands crossed out only while the page cannot reach the game */
  .strip i svg .x { display: none; }
  body.away .strip i svg .x { display: block; }
  .strip i.ifs { font-size: calc(13 * var(--u)); font-weight: 700; color: #3f9a37;
    line-height: 1.1; text-align: center; letter-spacing: 0; }

  /* (the fork) the console's start-up, as the Rejsekort manual has it (page 7, "Fuldt
     udstyr"): the strip of status cells, a white screen with the house mark in the middle
     and a line underneath saying how far it has come - the managers start, the data is
     brought up to date, the managers start again, and then the login stands there by
     itself. Starting the bus where there is no wi-fi puts a message up first. */
  #start { background: #fff; }
  #start .mid { position: absolute; left: 0; right: 0; top: var(--bar); bottom: 0; }
  #start .mark { position: absolute; left: 0; right: 0; top: calc(130 * var(--u)); text-align: center;
    font-size: calc(92 * var(--u)); font-weight: 700; color: #5d5e60; letter-spacing: calc(-2 * var(--u)); }
  #start .say { position: absolute; left: 0; right: 0; top: calc(420 * var(--u)); text-align: center;
    font-size: calc(30 * var(--u)); color: #1c1c1c; line-height: 1.35; white-space: pre-line; }
  .ask .btns button.lone { flex: 0 0 calc(240 * var(--u)); margin: 0 auto; }
</style>
</head>
<body>
<div id="stage">
  <!-- login: any driver number and password do -->
  <form id="login" class="screen" autocomplete="off">
    <div class="drawn title u" id="l-title">Web-IBIS</div>
    <div class="drawn lbl u" id="l-driver" style="top:calc(390*var(--u))"></div>
    <div class="drawn lbl u" id="l-password" style="top:calc(460*var(--u))"></div>
    <div class="drawn box u here" id="b-driver" style="left:calc(477*var(--u));top:calc(378*var(--u));width:calc(661*var(--u));height:calc(51*var(--u))"></div>
    <div class="drawn box u" id="b-password" style="left:calc(477*var(--u));top:calc(448*var(--u));width:calc(661*var(--u));height:calc(51*var(--u))"></div>
    <div class="drawn hint u" id="l-hint" style="top:calc(528*var(--u))"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };
let state = null, labels = {}, screen = null, line = null, lines = [], trips = [], pick = null, failures = 0;
// (the fork) the console's list is six rows deep, the lines two to a row; the arrows in
// the bar leaf through it, and `suggest` is the trip the console puts forward on yellow
const PER = { lines: 10, trips: 5, duty: 5 };
let page = { lines: 0, trips: 0, duty: 0 }, suggest = 0, nowS = 0, dutyHead = "";

// the screen as large as the tablet allows, at 16:9
function fit() {
  const u = Math.min(innerWidth / 1280, innerHeight / 720);
  document.documentElement.style.setProperty("--u", u + "px");
}
addEventListener("resize", fit); fit();

// the pictures are the player's own (the WebIBIS folder): without them, plain screens
const pic = new Image();
pic.onerror = () => document.querySelectorAll("#login, .screen").forEach((e) => e.classList.add("plain"));
pic.src = "/tex/login.png";

function show(name) {
  screen = name;
  document.querySelectorAll(".screen").forEach((e) => e.classList.toggle("on", e.id === name));
  footTabs(name);
  if (name === "lines") loadLines();
  if (name === "trips") loadTrips();
  if (name === "duty") drawDuty();
  // (the login keeps what stands in it while the console is locked: the driver's number)
  if (name === "login") { padClose(); if (!locked) { $("driver").value = ""; $("password").value = ""; } }
}

// (the fork) which of the console's menus the bar shows us standing in: yellow is the one
// we are in, blue and grey are the ones that lead nowhere (the manual's page 5)
function footTabs(name) {
  document.querySelectorAll(".foot").forEach((f) => {
    const menu = f.querySelector("[data-key='menu']"), linje = f.querySelector("[data-key='linje']");
    if (!menu || !linje) return;
    const inMenu = name === "menu" || name === "sound";
    menu.className = inMenu ? "now" : "off";
    linje.className = inMenu ? "blue" : "now";
  });
}

// (the fork) the console's strip of status cells and its bar of keys stand on more than
// one screen, so each is written once and put in every place it belongs
document.querySelectorAll("[data-strip]").forEach((e) => e.appendChild($("strip-cells").content.cloneNode(true)));
document.querySelectorAll("[data-foot]").forEach((e) => e.appendChild($("foot-keys").content.cloneNode(true)));

function words() {
  // (a text the game has no word for keeps the one the page was written with)
  document.querySelectorAll("[data-l]").forEach((e) => { const w = labels[e.dataset.l]; if (w != null) e.textContent = w; });
  // (the console writes a colon after each of the two, and the manual's picture with it)
  $("l-driver").textContent = (labels.driver ?? "") + ":"; $("l-password").textContent = (labels.password ?? "") + ":";
  loginWords(); $("lost").textContent = labels.lost ?? "⚠";
}

// (the fork) the login screen says two different things: the one the console shows when
// it starts up, and the one it shows while it is locked behind its own driver's pass code
function loginWords() {
  $("l-title").textContent = locked ? (labels.console_locked ?? "") : "Web-IBIS";
  $("l-hint").textContent = (locked ? labels.lock_hint : labels.login_hint) ?? "";
}

// (the fork) The console's number pad, as the Rejsekort manual has it: tapping a field
// brings it up, the number is typed into it and ENTER takes it. The driver's number is
// eight digits there and the pass code four; any number does here, as it always did.
const PAD_LEN = { driver: 8, password: 4 };
const padLen = (which) => (which && which.startsWith("vol:") ? 3 : PAD_LEN[which]);
let padFor = null, padVal = "";

function padOpen(which) {
  padFor = which; padVal = "";
  padShow(); padHere(which);
  $("pad").classList.add("on");
}
// (the field being typed into is the pale cyan one; the other stands white)
function padHere(which) {
  if (!which || which.startsWith("vol:")) return;
  $("b-driver").classList.toggle("here", which !== "password");
  $("b-password").classList.toggle("here", which === "password");
}
function padShow() {
  // the pass code is not shown as it is typed, any more than it is on the console
  $("pad-shown").textContent = padFor === "password" ? "*".repeat(padVal.length) : padVal;
}
function padClose() { $("pad").classList.remove("on"); padFor = null; padHere("driver"); }

$("pad").addEventListener("click", (e) => {
  // (a tap beside the panel closes it, as ESC does)
  if (e.target === $("pad")) padClose();
  const k = e.target.closest("[data-k]")?.dataset.k;
  if (!k || !padFor) return;
  if (k === "x") return padClose();
  if (k === "ce") { padVal = ""; return padShow(); }
  if (k === "enter" && padFor.startsWith("vol:")) {
    const which = padFor.slice(4);
    SND[which].vol = Math.max(0, Math.min(100, parseInt(padVal || "0", 10) || 0));
    padClose(); sndDraw(); return beep(which);
  }
  if (k === "enter") {
    const field = padFor;
    $(field).value = padVal;
    padClose();
    // the number first, then the code, then away - the manual's four steps
    if (field === "driver") padOpen("password");
    else $("login").requestSubmit();
    return;
  }
  if (padVal.length < padLen(padFor)) { padVal += k; padShow(); }
});

// a tap on either field brings the pad up instead of the device's own keyboard
["driver", "password"].forEach((id) => {
  const f = $(id);
  f.readOnly = true;
  f.addEventListener("focus", () => padOpen(id));
  f.addEventListener("click", () => padOpen(id));
});

// login: any number does
$("login").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!$("driver").value.trim()) return padOpen("driver");
  if (!$("password").value.trim()) return padOpen("password");
  store.set("driver", $("driver").value.trim());
  $("password").value = "";
  unlock();
  // (back to the trip, when one is under way: a driver change leaves it standing)
  show(state && state.duty ? "duty" : "lines");
});
// locked, ESC is the manual's "tast ESC for chaufførskift"; otherwise it empties the fields
document.querySelector("#login .esc").addEventListener("click", () => {
  padClose();
  unlock();
  $("driver").value = ""; $("password").value = "";
  padOpen("driver");
});

async function getJson(url, opts) {
  const r = await fetch(url, Object.assign({ cache: "no-store" }, opts));
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

// the console writes the hour of departure out to the second
function hms(s) {
  const n = Math.round(s) % 86400, p = (v) => String(v).padStart(2, "0");
  return `${p(Math.floor(n / 3600))}:${p(Math.floor(n / 60) % 60)}:${p(n % 60)}`;
}
function leaves(n, per) { return Math.max(1, Math.ceil(n / per)); }

async function loadLines() {
  let v; try { v = await getJson("/lines"); } catch (e) { return; }
  lines = v.lines || [];
  page.lines = Math.min(page.lines, leaves(lines.length, PER.lines) - 1);
  drawLines();
}

// LINJEVALG: the lines two to a row, six rows deep, the one being driven on yellow
function drawLines() {
  const mine = state && state.duty ? state.duty.line : null;
  const from = page.lines * PER.lines, shown = lines.slice(from, from + PER.lines);
  let html = shown.map((l) =>
    `<button class="cell${l.sign === mine ? " mine" : ""}" data-line="${esc(l.name)}">${esc(l.sign)}</button>`).join("");
  for (let i = shown.length; i < PER.lines; i++) html += `<div class="cell gap"></div>`;
  $("keys").innerHTML = html;
  $("no-lines").hidden = lines.length > 0;
  $("keys").querySelectorAll("[data-line]").forEach((k) =>
    k.addEventListener("click", () => { line = k.dataset.line; page.trips = 0; show("trips"); }));
}

async function loadTrips(keep) {
  if (!line) return show("lines");
  let v; try { v = await getJson("/trips?line=" + encodeURIComponent(line)); } catch (e) { return; }
  trips = v.trips || [];
  nowS = v.now_s;
  drawTrips(keep);
}

// TURVALG: the hour and the tour over the two ends of the trip, the one the console puts
// forward on yellow - the trip under way, or else the next one to leave
function drawTrips(keep) {
  if (!keep) {
    let i = trips.findIndex((t) => t.driving);
    if (i < 0) i = trips.findIndex((t) => t.arr_s >= nowS);
    suggest = Math.max(0, i);
    page.trips = Math.floor(suggest / PER.trips);
  }
  page.trips = Math.min(page.trips, leaves(trips.length, PER.trips) - 1);
  const from = page.trips * PER.trips, shown = trips.slice(from, from + PER.trips);
  let html = shown.map((t, i) => {
    const at = from + i, mark = t.driving ? " driving" : at === suggest ? " pick" : "";
    return `<button class="trip${mark}${t.arr_s < nowS ? " past" : ""}" data-i="${at}">
      <span class="w">${esc(hms(t.dep_s))} - ${esc(t.tour)}</span>
      <span class="r">${esc(t.from)} - ${esc(t.to)}</span></button>`;
  }).join("");
  for (let i = shown.length; i < PER.trips; i++) html += `<div class="trip gap"></div>`;
  $("trip-list").innerHTML = html;
  $("no-trips").hidden = trips.length > 0;
  $("trip-list").querySelectorAll("[data-i]").forEach((r) =>
    r.addEventListener("click", () => ask(trips[+r.dataset.i])));
}

function ask(t) {
  pick = t;
  $("ask-what").textContent = `${hms(t.dep_s)} - ${t.tour}\n${t.from} - ${t.to}`;
  $("ask-err").textContent = "";
  $("ask").classList.add("on");
}

// (the fork) the console's bar: ESC steps back, Linje is the menu we stand in, and the
// arrows leaf through the list. Menu, Billetter and Betjening belong to the real console
// and not to this page, so they stand blue and grey, which is the console's own way of
// saying a key leads nowhere.
document.querySelectorAll("[data-key]").forEach((b) => b.addEventListener("click", () => {
  const k = b.dataset.key;
  if (k === "esc") {
    if (screen === "sound") return show("menu");
    if (screen === "menu") return show(state && state.duty ? "duty" : "lines");
    if (screen === "lines") { store.set("driver", null); return show("login"); }
    return show("lines");
  }
  if (k === "menu") return show("menu");
  if (k === "linje") return show(screen !== "duty" && state && state.duty ? "duty" : "lines");
  leaf(k === "down" ? 1 : -1);
}));

// (the fork) CHAUFFØRSKIFTE - LÅS KONSOL, the manual's pages 17 to 21. Lås konsol holds
// the console over a short break - the same driver types the pass code to open it again.
// Chaufførskift hands the bus on: the line and the trip stay, only the driver changes.
// Log ud is for coming back to the garage.
let locked = false;
function lockConsole() {
  locked = true;
  $("login").classList.add("locked");
  $("driver").value = store.get("driver") || "";
  $("password").value = "";
  loginWords();
  show("login");
  padOpen("password");
}
function unlock() {
  locked = false;
  $("login").classList.remove("locked");
  loginWords();
}
document.querySelectorAll("#menu [data-m]").forEach((b) => b.addEventListener("click", () => {
  const m = b.dataset.m;
  if (m === "sound") return show("sound");
  if (m === "lock") return lockConsole();
  unlock();
  if (m === "logout") store.set("driver", null);   // (a change keeps the duty and the number)
  show("login");
  padOpen("driver");
}));

function leaf(d) {
  if (screen === "lines") { page.lines = Math.max(0, Math.min(page.lines + d, leaves(lines.length, PER.lines) - 1)); return drawLines(); }
  if (screen === "trips") { page.trips = Math.max(0, Math.min(page.trips + d, leaves(trips.length, PER.trips) - 1)); return drawTrips(true); }
  page.duty = Math.max(0, page.duty + d);
  drawDuty();
}
$("ask-no").addEventListener("click", () => $("ask").classList.remove("on"));
$("ask-yes").addEventListener("click", async () => {
  if (!pick || !line) return;
  const body = new URLSearchParams({ line, tour: pick.tour, pos: String(pick.pos) });
  let v; try { v = await getJson("/start", { method: "POST", body }); } catch (e) { v = { ok: false, error: labels.lost }; }
  if (!v.ok) { $("ask-err").textContent = v.error || "?"; return; }
  $("ask").classList.remove("on");
  setTimeout(() => show("duty"), 600);
});

// (the fork) the stops of the trip under way. Standing at a stop, the list begins there;
// rolling between two, the console keeps the one just left standing above the one ahead,
// and marks them both - so the list begins one stop further back.
function dutyStops(d, atStop) {
  const all = [];
  let here = false;
  for (const r of d.rows) {
    if (r.k === "trip") { if (here) break; here = r.state === "now"; continue; }
    if (here && r.k === "stop") all.push(r);
  }
  let i = all.findIndex((s) => s.state !== "done");
  if (i < 0) i = Math.max(0, all.length - 1);
  const start = atStop ? i : Math.max(0, i - 1);
  return { list: all.slice(start), now: i - start };
}

// the red sign with the hand: the bus stands at this stop
const HAND = `<svg viewBox="0 0 24 24"><path d="M8.3 1.4h7.4l6.9 6.9v7.4l-6.9 6.9H8.3l-6.9-6.9V8.3z" fill="#e03a35" stroke="#fff" stroke-width="1.2"/>
  <g fill="#fff"><rect x="8.5" y="7" width="1.9" height="6.4" rx=".95"/><rect x="10.8" y="6" width="1.9" height="7.4" rx=".95"/>
  <rect x="13.1" y="6.6" width="1.9" height="6.8" rx=".95"/><rect x="15.4" y="8" width="1.9" height="5.4" rx=".95"/>
  <path d="M8.5 11.3h8.8v2.5a4.4 4.4 0 0 1-4.4 4.4 4.4 4.4 0 0 1-4.4-4.4z"/>
  <path d="m8.5 12.6-2.2-2.2a1 1 0 0 0-1.4 1.4l2.7 3z"/></g></svg>`;

// and the two blue arrows the console shows while the bus rolls: one out of the stop it
// has left, one into the stop it heads for
const ARROW = (id, d) => `<svg viewBox="0 0 24 24"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#6fc3ea"/><stop offset=".45" stop-color="#3b84c9"/><stop offset="1" stop-color="#2a63a8"/></linearGradient></defs>
  <circle cx="12" cy="12" r="11" fill="url(#${id})"/><path d="${d}" fill="#fff"/></svg>`;
const GONE = ARROW("a-out", "M6 10.2h7.2V7.2L18.4 12l-5.2 4.8v-3H6z");
const COMING = ARROW("a-in", "M18 10.2h-7.2V7.2L5.6 12l5.2 4.8v-3H18z");

// TUR I AUTOMATISK STOPPESTEDSVALG: the screen the trip is driven by
function drawDuty() {
  const box = $("duty-body");
  if (!state) return;
  const d = state.duty, L = labels;
  if (!d) { box.innerHTML = `<div class="empty">${esc(L.no_duty)}</div>`; return; }
  const { list: stops, now } = dutyStops(d, d.at_stop);
  const head = stops.length ? stops[0].name : "";
  if (head !== dutyHead) { dutyHead = head; page.duty = 0; }   // (the bus moved on)
  page.duty = Math.max(0, Math.min(page.duty, leaves(stops.length, PER.duty) - 1));
  // with the GPS off the driver picks the stop ahead himself, but only while rolling
  const hand = d.gps === false, pick = hand && !d.at_stop;
  const from = page.duty * PER.duty, shown = stops.slice(from, from + PER.duty);
  let right = shown.map((s, i) => {
    const at = from + i;
    const mark = d.at_stop ? (at === now ? HAND : "") : at === now - 1 ? GONE : at === now ? COMING : "";
    const take = pick && at > now && s.i != null;
    return `<div class="stop${take ? " pickable" : ""}"${take ? ` data-stop="${s.i}"` : ""}><span class="n">${esc(s.name)}</span>
      <span class="t">${esc(s.exp || s.time)}</span>${mark}</div>`;
  }).join("");
  for (let i = shown.length; i < PER.duty; i++) right += `<div class="slot"></div>`;
  box.innerHTML = `<div class="side${hand ? " manual" : ""}">
      ${hand ? `<button class="end" id="at-stop">${esc(d.at_stop ? L.departed : L.arrived)}</button>` : ""}
      <div class="panel"><span>${esc(L.line)}: ${esc(d.line || "")}</span>
        <span>${esc(L.tour)}: ${esc(d.tour || "")}</span>
        <span>${esc(L.delay)}: ${esc(d.delay)}</span></div>
      <button class="end" id="end-trip">${esc(L.end_trip)}</button>
      <div class="slot"></div>
    </div><div class="stops">${right}</div>`;
  $("end-trip").addEventListener("click", endTrip);
  // (the fork) the manual's four steps: Afgået when the doors are shut, Ankommet before
  // they open again, and a tap on a stop further down to leave one out on the way
  if (hand) $("at-stop").addEventListener("click", () => tell("/at_stop", { at: d.at_stop ? "0" : "1" }));
  box.querySelectorAll("[data-stop]").forEach((e) =>
    e.addEventListener("click", () => tell("/head_for", { stop: e.dataset.stop })));
}

// a word to the game, and the answer straight back into the screen
async function tell(what, body) {
  try { await getJson(what, { method: "POST", body: new URLSearchParams(body) }); } catch (e) { return; }
  try { state = await getJson("/state"); } catch (e) {}
  if (screen === "duty") drawDuty();
}


// (the fork) INDSTILLING AF LYD, the manual's page 30. The console beeps when a key is
// pressed, differently when the key does nothing, and again when something is wrong; this
// page runs in a browser, so it can do all three itself. What the driver sets is kept in
// the browser, not in the game - it is this tablet's sound, not the bus's.
const SND = { key: { on: true, vol: 50 }, dead: { on: true, vol: 50 }, fault: { on: true, vol: 60 } };
let audio = null;

function sndLoad() {
  try {
    const v = JSON.parse(localStorage.getItem("snd") || "null");
    if (v) for (const k of ["key", "dead", "fault"]) if (v[k]) Object.assign(SND[k], v[k]);
  } catch (e) {}
}
function sndSave() { try { localStorage.setItem("snd", JSON.stringify(SND)); } catch (e) {} }

// a short blip, the way the console's keys sound: bright for a key that does something,
// dull for one that does not, and two tones for a fault
function beep(kind) {
  const s = SND[kind];
  if (!s || !s.on || !s.vol) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const at = audio.currentTime, loud = Math.min(1, s.vol / 100) * 0.22;
    const tone = (hz, from, len, shape) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = shape; o.frequency.setValueAtTime(hz, at + from);
      g.gain.setValueAtTime(loud, at + from);
      g.gain.exponentialRampToValueAtTime(0.0001, at + from + len);
      o.connect(g).connect(audio.destination);
      o.start(at + from); o.stop(at + from + len + 0.02);
    };
    if (kind === "key") tone(1180, 0, 0.06, "sine");
    else if (kind === "dead") tone(260, 0, 0.1, "square");
    else { tone(880, 0, 0.17, "sine"); tone(660, 0.22, 0.26, "sine"); }
  } catch (e) {}
}

// every key on every screen answers: the console's own two sounds
$("stage").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || b.closest("#sound")) return;          // (the sound screen has its own Test keys)
  beep(b.classList.contains("dead") || b.classList.contains("blue") ? "dead" : "key");
}, true);

function sndDraw() {
  document.querySelectorAll("#sound [data-s]").forEach((b) => { b.textContent = SND[b.dataset.s].on ? "ON" : "OFF"; });
  document.querySelectorAll("#sound [data-v]").forEach((b) => { b.textContent = String(SND[b.dataset.v].vol); });
}
document.querySelectorAll("#sound [data-s]").forEach((b) => b.addEventListener("click", () => {
  SND[b.dataset.s].on = !SND[b.dataset.s].on; sndDraw(); beep(b.dataset.s);
}));
document.querySelectorAll("#sound [data-t]").forEach((b) => b.addEventListener("click", () => beep(b.dataset.t)));
document.querySelectorAll("#sound [data-v]").forEach((b) => b.addEventListener("click", () => padOpen("vol:" + b.dataset.v)));
$("snd-save").addEventListener("click", () => { sndSave(); beep("key"); show("menu"); });
sndLoad();
sndDraw();

// (the fork) the row of card readers along the foot of the screen: the last cards held
// to one, newest first, the crossed ones checked out
function drawCards() {
  const c = (state && state.cards) || [];
  const html = Array.from({ length: 5 }, (_, i) => {
    const k = c[i];
    return k ? `<i class="${esc(k.card || "personal")}${k.out ? " out" : ""}">${esc(k.who)}</i>` : "<i></i>";
  }).join("");
  document.querySelectorAll("[data-cards]").forEach((e) => { if (e.innerHTML !== html) e.innerHTML = html; });
}

// (the fork) the console's GPS key: pressing it turns the stops over to the driver, and
// the console says so with the manual's own message. Pressing it again gives them back.
let warnTimer = 0;
function warn(text) {
  $("warn-what").textContent = text || "";
  $("warn").classList.add("on");
  beep("fault");
  clearTimeout(warnTimer);
  warnTimer = setTimeout(() => $("warn").classList.remove("on"), 5000);
}
$("warn-ok").addEventListener("click", () => { clearTimeout(warnTimer); $("warn").classList.remove("on"); });
document.querySelectorAll(".strip .gps").forEach((e) => e.addEventListener("click", async () => {
  if (!state || !state.duty) return;
  const on = state.duty.gps === false;   // the key turns it to the other side
  await tell("/gps", { on: on ? "1" : "0" });
  if (!on) warn(labels.manual_pos);      // "((41)) : Manuel position"
}));

// the manual: Afslut tur takes back the chosen trip, and the console stands on Turvalg
async function endTrip() {
  const sign = state && state.duty ? state.duty.line : null;
  if (!lines.length) { try { lines = (await getJson("/lines")).lines || []; } catch (e) {} }
  const l = lines.find((x) => x.sign === sign);
  if (!l) return show("lines");
  line = l.name; page.trips = 0; show("trips");
}

// (the fork) The console's start-up, as the Rejsekort manual has it (page 7, "Fuldt
// udstyr"): the managers start, the data is brought up to date, the managers start again,
// and then the login stands there by itself. The manual's wi-fi message belongs to a bus
// started out of reach of the network; here it comes when the console cannot reach the
// game at all. A tap carries on past the start-up, as nobody wants to watch it twice.
const BOOT = [["starting", 2000], ["updating", 2400], ["starting", 1600]];
let booting = true, bootAt = 0, bootTimer = 0;

function bootStep() {
  if (!booting) return;
  if (bootAt >= BOOT.length) return bootDone();
  const [key, ms] = BOOT[bootAt++];
  $("say").textContent = labels[key] ?? SAY[key];
  bootTimer = setTimeout(bootStep, ms);
}
function bootDone() {
  if (!booting) return;
  booting = false;
  clearTimeout(bootTimer);
  if (!state) return $("wifi").classList.add("on");   // nothing answered: no connection
  if (!route()) show("login");
}
// where the console belongs once it is up: back on the duty it was left on, or the login
function route() {
  if (!store.get("driver")) return false;
  show(state && state.duty ? "duty" : "lines");
  return true;
}
$("start").addEventListener("click", bootDone);
$("wifi-ok").addEventListener("click", () => { $("wifi").classList.remove("on"); if (!route()) show("login"); });
// (the words the page was written with, until the game sends its own)
const SAY = { starting: "Starter managers… Vent venligst…", updating: "Opdatering i gang.\nDet tager maks. 3 minutter" };
show("start");
bootStep();

async function tick() {
  try {
    const s = await getJson("/state");
    failures = 0; $("lost").classList.remove("on"); document.body.classList.remove("away");
    if (s.labels) {
      const first = !state;
      state = s; labels = s.labels; words();
      // (the fork) the GPS cell goes grey on every screen while the stops are by hand
      document.body.classList.toggle("nogps", !!(s.duty && s.duty.gps === false));
      drawCards();
      document.querySelectorAll(".c-date").forEach((e) => { e.textContent = s.date || ""; });
      document.querySelectorAll(".c-time").forEach((e) => { e.textContent = s.clock || ""; });
      if (first) { if (!booting) route(); }
      else if (screen === "duty") drawDuty();
    }
  } catch (e) {
    if (++failures >= 3) { $("lost").classList.add("on"); document.body.classList.add("away"); }
  }
  setTimeout(tick, 1000);
}
// (a line's trips again now and then: which are past, which is driven)
setInterval(() => { if (screen === "trips" && !$("ask").classList.contains("on")) loadTrips(true); }, 30000);
tick();
</script>
</body>
</html>
